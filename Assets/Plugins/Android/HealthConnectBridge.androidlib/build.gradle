// Resolves the Kotlin Gradle plugin through this module's own buildscript rather than the
// plugins {} DSL — Unity's root Gradle template uses the classic apply-plugin style, and a
// plugins {} block is only legal as the very first statement in the file, before any apply
// plugin: line. Scoping it here means the Kotlin plugin classpath doesn't need to be added to
// Unity's root/settings Gradle templates at all.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'dk.trainingbuddy.game.healthconnect'
    // 34 is required to compile against the Health Connect client APIs used here. If the
    // installed Android SDK's highest platform is lower than 34, install it via SDK Manager.
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 30
        targetSdkVersion 34
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            kotlin.srcDirs = ['src/main/kotlin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}