apply plugin: 'com.android.library'
// This project's AGP is 9.0.0 (see the root build.gradle), which has built-in Kotlin support
// enabled by default — no org.jetbrains.kotlin.android plugin needed. Applying it on top throws
// ("cannot be cast to BaseExtension"): its AGP integration isn't compatible with AGP 9's new
// library-extension internals. src/main/kotlin and src/main/AndroidManifest.xml are both already
// AGP's default source locations, so no explicit sourceSets block is needed either.

android {
    namespace 'dk.trainingbuddy.game.healthconnect'
    // 34 is required to compile against the Health Connect client APIs used here. If the
    // installed Android SDK's highest platform is lower than 34, install it via SDK Manager.
    compileSdk 34

    defaultConfig {
        minSdkVersion 30
        targetSdkVersion 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}