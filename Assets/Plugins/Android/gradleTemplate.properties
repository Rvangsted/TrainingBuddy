org.gradle.jvmargs=-Xmx**JVM_HEAP_SIZE**M
org.gradle.parallel=true
unityStreamingAssets=**STREAMING_ASSETS**
# Android Resolver Properties Start
android.useAndroidX=true
android.enableJetifier=true
# Android Resolver Properties End
**ADDITIONAL_PROPERTIES**
# Unity's own injected properties above (substituted at **ADDITIONAL_PROPERTIES**) include
# android.builtInKotlin=false, which silently skips compiling HealthConnectBridge.androidlib's
# .kt sources (no error, just an empty module) instead of failing the build. This line must stay
# below the placeholder so it wins the last-value-wins override in the generated gradle.properties.
android.builtInKotlin=true
